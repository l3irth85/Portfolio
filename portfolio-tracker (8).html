    units: ["unit"]

  weight: {

    units: ["mg", "g", "kg", "oz", "lb"]

  mg: 0.001,
  g: 1,
  kg: 1000,
  oz: 31.1034768,
  lb: 453.59237

  unit: "unit",
  mg: "mg",
  g: "g",
  kg: "kg",
  oz: "oz (troy)",
  lb: "lb"
